name: Collecte immobilière

on:
  schedule:
    # 08:00, 13:00, 20:00 heure de Maurice (UTC+4) = 04:00, 09:00, 16:00 UTC
    - cron: "0 4 * * *"
    - cron: "0 9 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      mode_test:
        description: "Mode test (ne rien écrire ni envoyer)"
        type: boolean
        default: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    # Mesuré en conditions réelles (sept. 2026) : ~15s par appel Apify en
    # moyenne, jusqu'à ~60 sources Facebook actives selon les fréquences
    # qui coïncident (+ les 11 sites, + les appels Gemini) -> jusqu'à
    # ~15-18 min rien que pour Facebook les jours chargés. Marge large.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Lancer la collecte
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT_EMAIL: ${{ secrets.VAPID_CONTACT_EMAIL }}
        run: |
          if [ "${{ inputs.mode_test }}" = "true" ]; then
            python -m collecte.main --test
          else
            python -m collecte.main
          fi
