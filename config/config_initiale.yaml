# Configuration initiale — source de vérité migrée vers Supabase par
# scripts/migrer_config_vers_supabase.py au premier lancement (et à chaque
# modification manuelle de ce fichier, via --forcer).
#
# Après la migration initiale, Supabase (tables `parametres`, `secteurs`,
# `sources`) devient la source de vérité vivante : les ajouts/désactivations
# de sources se font depuis l'écran d'administration de l'app, pas ici.

criteres:
  budget_min_roupies: 5000000
  budget_max_roupies: 10000000
  types_acceptes: [maison, terrain]
  mots_exclus:
    - pds
    - irs
    - res
    - "sur plan"
    - off-plan
    - vefa
    - "à louer"
    - "a louer"
    - "for rent"
    - "to let"
    - location
  distance_plage_max_km: 3

secteurs:
  - id: trou_aux_biches
    nom: "Trou aux Biches"
    alias: ["trou aux biches", "trou-aux-biches", "tab"]
  - id: mont_choisy
    nom: "Mont Choisy"
    alias: ["mont choisy", "mont-choisy"]
  - id: pointe_aux_canonniers
    nom: "Pointe aux Canonniers"
    alias: ["pointe aux canonniers", "pointe-aux-canonniers", "canonniers"]
  - id: grand_baie
    nom: "Grand Baie"
    alias: ["grand baie", "grand-baie", "grand bay"]
  - id: pereybere
    nom: "Péreybère"
    alias: ["pereybere", "péreybère", "perey-bere", "perey bere"]
  - id: bain_boeuf
    nom: "Bain Boeuf"
    alias: ["bain boeuf", "bain bœuf", "bain-boeuf"]
  - id: cap_malheureux
    nom: "Cap Malheureux"
    alias: ["cap malheureux", "cap-malheureux", "st francois", "st françois", "saint francois", "saint françois"]

# ---------------------------------------------------------------------------
# Sites (extraction JSON-LD -> OpenGraph/heuristiques -> Gemini en dernier repli)
# ---------------------------------------------------------------------------
sources_sites:
  # identifiant = page d'index à parcourir pour trouver les annonces individuelles.
  # Validé en direct pour lexpressproperty (rendu HTML côté serveur, OK pour
  # httpx). Les autres pointent vers l'accueil par défaut et devront être
  # ajustés vers leur page de recherche/liste réelle avant le premier run —
  # voir README, section "Valider une nouvelle source".
  - identifiant: "https://www.lexpressproperty.com/en/buy-mauritius/"
    nom: "Lexpressproperty"
  - identifiant: "https://www.propertycloud.mu/"
    nom: "PropertyCloud"
    # Vérifié en direct : protégé par un défi anti-bot Cloudflare, bloque
    # même un navigateur automatisé standard. httpx échouera très
    # probablement. À traiter comme source à risque : laissée active pour
    # que l'auto-réparation la documente, mais ne pas s'étonner d'échecs
    # récurrents tant qu'une solution (proxy resi, API alternative...)
    # n'est pas trouvée.
  - identifiant: "https://www.propertymap.mu/"
    nom: "PropertyMap"
  - identifiant: "https://www.propertyconsult.mu/"
    nom: "Property Consult"
  - identifiant: "https://www.real-estate.mu/"
    nom: "Prospera (real-estate.mu)"
  - identifiant: "https://mu.green-acres.com/en"
    nom: "Green-Acres Maurice"
  - identifiant: "https://www.ofim.mu/en/index.html"
    nom: "OFIM"
  - identifiant: "https://myimmomauritius.com/fr"
    nom: "My Immo Mauritius"
  - identifiant: "https://www.ayoimmobilier.mu/"
    nom: "AYO Immobilier"
  - identifiant: "https://real-estate-mauritius.mu/en/"
    nom: "Westimmo"
  - identifiant: "https://www.decordier-immobilier.mu/en/"
    nom: "Decordier Immobilier"

